
name: Build Plugin

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Find and Build Plugin
        shell: bash
        run: |
          POM=$(find . -name pom.xml -not -path "*/target/*" -print -quit)
          if [ -z "$POM" ]; then
            echo "ERROR: No pom.xml found!"
            exit 1
          fi
          echo "Found Maven project: $POM"
          mvn -f "$POM" --batch-mode clean package

      - name: Upload Plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: EvilSMPAbilitiesReborn-jar
          path: '**/target/*.jar'
          if-no-files-found: error
